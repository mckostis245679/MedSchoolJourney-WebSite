<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Επικοινωνία – MedSchool Journey</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js"></script>

  <script
    type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
  ></script>
  <script type="text/javascript">
    (function () {
      emailjs.init("rQ6jHP2udsVi0SPDh");
    })();
  </script>
</head>
<body>

  <!-- Header (dynamic placeholder) -->
  <div id="header-placeholder"></div>

  <!-- Hero Section -->
  <section class="page-hero">
    <div class="container">
      <h1>Επικοινωνία</h1>
      <p>Είμαστε εδώ για να απαντήσουμε στις ερωτήσεις σας, να σας καθοδηγήσουμε και να ακούσουμε τα σχόλιά σας.</p>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="contact-page-section">
    <div class="container contact-layout">
      <!-- Contact Info -->
      <div class="contact-info">
        <h2>Στοιχεία Επικοινωνίας</h2>
        <p><strong>Facebook:</strong> MEDschoolJourney1</p>
        <p><strong>Instagram:</strong> medschool_journey.meduoa</p>
        <p><strong>Email:</strong> medschooljourney1@gmail.com</p>
      </div>
  
      <!-- Contact Form -->
      <div class="contact-form-wrapper">
        <h2>Στείλτε μας ένα μήνυμα</h2>
        <form class="contact-form" onsubmit="sendMail(); return false;">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
          />
  
          <label for="message">Μήνυμα</label>
          <textarea
            id="message"
            rows="5"
            placeholder="Enter your message"
            required
          ></textarea>
  
          <button id="sendBtn" class="btn" type="submit">Αποστολή</button>
        </form>
      </div>
    </div>
  </section>
  <!-- Footer (dynamic placeholder) -->
  <div id="footer-placeholder"></div>

  <!-- All custom JS -->
  <script src="js/script.js"></script>
</body>
</html>
