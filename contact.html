<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Επικοινωνία – MedSchool Journey</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- EmailJS SDK -->
  <script src="https://cdn.emailjs.com/sdk/3.2.0/email.min.js"></script>
</head>
<body>

  <!-- Header (dynamic placeholder) -->
  <div id="header-placeholder"></div>

  <!-- Hero Section -->
  <section class="page-hero">
    <div class="container">
      <h1>Επικοινωνία</h1>
      <p>Είμαστε εδώ για να απαντήσουμε στις ερωτήσεις σας, να σας καθοδηγήσουμε και να ακούσουμε τα σχόλιά σας.</p>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="contact-page-section">
    <div class="container contact-layout">
      <!-- Contact Info -->
      <div class="contact-info">
        <h2>Στοιχεία Επικοινωνίας</h2>
        <p><strong>Facebook:</strong> MEDschoolJourney1</p>
        <p><strong>Instagram:</strong> medschool_journey.meduoa</p>
        <p><strong>Email:</strong> medschooljourney1@gmail.com</p>
      </div>

      <!-- Contact Form -->
      <div class="contact-form-wrapper">
        <h2>Στείλτε μας ένα μήνυμα</h2>
        <form id="contact-form">
          <label for="cname">Όνομα:</label>
          <input type="text" id="cname" name="cname" required>

          <label for="cemail">Email:</label>
          <input type="email" id="cemail" name="cemail" required>

          <label for="cmessage">Μήνυμα:</label>
          <textarea id="cmessage" name="cmessage" rows="5" required></textarea>

          <button id="button" type="submit" class="btn">Αποστολή</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer (dynamic placeholder) -->
  <div id="footer-placeholder"></div>

  <!-- Inline EmailJS code -->
  <script>
    // 0) EmailJS Public Key + Service & Template IDs
    emailjs.init("rQ6jHP2udsVi0SPDh");
    const SERVICE_ID  = "service_tnlv7fn";
    const TEMPLATE_ID = "template_kfos0wa";

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("contact-form");
      const btn  = document.getElementById("button");
      if (!form || !btn) return;

      form.addEventListener("submit", function(e) {
        e.preventDefault();

        // Feedback
        btn.disabled = true;
        btn.textContent = "Αποστολή...";

        emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, this)
          .then(() => {
            alert("Το μήνυμά σας εστάλη με επιτυχία!");
            form.reset();
          })
          .catch(err => {
            console.error("EmailJS Error:", err);
            alert("Παρουσιάστηκε σφάλμα. Παρακαλώ δοκιμάστε ξανά.");
          })
          .finally(() => {
            btn.disabled = false;
            btn.textContent = "Αποστολή";
          });
      });
    });
  </script>

  <!-- External script.js for header/footer loading -->
  <script src="js/script.js"></script>
</body>
</html>
