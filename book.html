<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Λεπτομέρειες Βιβλίου</title>
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
  <link rel="manifest" href="favicon_io/site.webmanifest">
  <!-- Link to your main CSS -->
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js"></script>
  <script
    type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
  ></script>
  <script type="text/javascript">
    (function () {
      emailjs.init("rQ6jHP2udsVi0SPDh");
    })();
  </script>
</head>
<body>

  <!-- Header placeholder -->
  <div id="header-placeholder"></div>

  <!-- Breadcrumb Section -->
  <section class="breadcrumb">
    <div class="container">
      <a href="notes.html">e-Books</a>
      <span class="breadcrumb-sep">/</span>
      <a id="breadcrumbCategory" class="breadcrumb-category" href="#">Κατηγορία</a>
      <span class="breadcrumb-sep">/</span>
      <span class="current" id="breadcrumbCurrent">Τίτλος Βιβλίου</span>
    </div>
  </section>

  <!-- Ενότητα Λεπτομερειών Βιβλίου -->
  <section class="book-detail-section container">
    <div class="book-layout">
      <!-- Αριστερή Στήλη: Τίτλος, Υπότιτλος, Λίστες -->
      <div class="book-left">
        <h1 class="book-main-title" id="bookTitle">[Τίτλος Βιβλίου]</h1>
        <p class="book-subtitle" id="bookSubtitle">[Υπότιτλος]</p>
        <div class="col-lists">
          <!-- Ύλη που καλύπτεται -->
          <div class="syllabus-col">
            <h3>ΠΕΡΙΕΧΟΜΕΝΑ e-Book</h3>
            <ul id="syllabusList">
              <!-- Δυναμική ενημέρωση -->
            </ul>
          </div>
          
        </div>
      </div>

      <!-- Δεξιά Στήλη: Εικόνα βιβλίου -->
      <div class="book-right">
        <img id="bookImage" src="images/placeholder.jpg" alt="Εικόνα Βιβλίου">
      </div>
    </div>

    <!-- Παράγραφος “Περισσότερα” κάτω από τις δύο στήλες -->
    <div class="book-more">
      <h2>Περισσότερα</h2>
      <p id="contentsList">
        <!-- Εδώ προβάλλεται η περίληψη ή το επιπλέον κείμενο του βιβλίου -->
      </p>
    </div>
  </section>

  <!-- ========== ΕΠΙΚΟΙΝΩΝΙΑ ========== -->
  <section class="inquiry-section">
    <div class="container">
      <h2>ΕΠΙΚΟΙΝΩΝΙΑ</h2>
      <p>Είστε έτοιμοι να ξεκινήσουμε; Συμπληρώστε τα στοιχεία επικοινωνίας σας!</p>
      <form class="contact-form" onsubmit="sendMail(); return false;">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter email"
          required
        />

        <label for="message">Μήνυμα</label>
        <textarea
          id="message"
          rows="5"
          placeholder="Enter your message"
          required
        ></textarea>

        <button id="sendBtn" class="btn" type="submit">Αποστολή</button>
      </form>
    </div>
  </section>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="js/book.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
