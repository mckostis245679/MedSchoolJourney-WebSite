<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Λεπτομέρειες Βιβλίου</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header placeholder (φορτώνεται δυναμικά από script) -->
  <div id="header-placeholder"></div>

  <!-- Breadcrumb Section -->
  <section class="breadcrumb">
    <div class="container">
      <a href="notes.html">e-Books</a>
      <span class="breadcrumb-sep">/</span>
      <a id="breadcrumbCategory" class="breadcrumb-category" href="#">Κατηγορία</a>
      <span class="breadcrumb-sep">/</span>
      <span class="current" id="breadcrumbCurrent">Τίτλος Βιβλίου</span>
    </div>
  </section>

  <!-- Ενότητα Λεπτομερειών Βιβλίου -->
  <section class="book-detail-section container">
    <div class="book-layout">
      <!-- Αριστερή Στήλη: Πληροφορίες βιβλίου και λίστες -->
      <div class="book-left">
        <h1 class="book-main-title" id="bookTitle">[Τίτλος Βιβλίου]</h1>
        <p class="book-subtitle" id="bookSubtitle">[Υπότιτλος]</p>
        <div class="col-lists">
          <!-- Ύλη που καλύπτεται -->
          <div class="syllabus-col">
            <h3>ΠΕΡΙΕΧΟΜΕΝΑ e-Book</h3>
            <ul id="syllabusList">
              <!-- Δυναμική ενημέρωση με στοιχεία -->
            </ul>
          </div>
          <!-- Περιεχόμενα Συγγράμματος -->
          <div class="contents-col">
            <h3>Περισσότερα</h3>
            <ul id="contentsList">
              <!-- Δυναμική ενημέρωση με στοιχεία -->
            </ul>
          </div>
        </div>
      </div>

      <!-- Δεξιά Στήλη: Εικόνα βιβλίου -->
      <div class="book-right">
        <img id="bookImage" src="images/placeholder.jpg" alt="Εικόνα Βιβλίου">
      </div>
    </div>
  </section>

  <!-- Footer placeholder (φορτώνεται δυναμικά από script) -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="js/book.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
